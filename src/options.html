<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GitHub学生データ設定</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 720px; margin: 0 auto; line-height: 1.5; }
    textarea { width: 100%; height: 260px; font-family: monospace; font-size: 13px; padding: 8px; box-sizing: border-box; }
    .hint { background: #f6f8fa; border: 1px solid #d0d7de; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
    button { background: #1f883d; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1a7f37; }
    #status { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>GitHub アカウント・学生名簿設定</h2>
  <div class="hint">
    <strong>貼り付け形式（自動判別）:</strong><br>
    ・<strong>Excelからのコピペ / TSV / CSV:</strong> <code>GitHubID, 学籍番号, 氏名, グループ</code><br>
    ・<strong>JSON形式:</strong> <code>{"octocat": {"id": "K24001", "name": "山田太郎", "group": "チームA"}}</code>
  </div>

  <textarea id="raw-data" placeholder="GitHubID&#9;学籍番号&#9;氏名&#9;グループ (Excelからそのままコピー＆ペースト可能)"></textarea>
  <br><br>
  <button id="save-btn">保存する</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
